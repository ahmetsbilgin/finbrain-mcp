[build-system]
requires = ["setuptools>=65", "setuptools-scm>=8", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "finbrain-mcp"
dynamic         = ["version"]
description     = "Open-source FinBrain MCP server (SDK-first via finbrain-python)"
readme          = "README.md"
license         = "MIT"
authors         = [{name = "Ahmet Salim Bilgin", email="ahmet@finbrain.tech"}]
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=3,<4",
  "pydantic>=2",
  "finbrain-python>=0.2.6",
]

[project.optional-dependencies]
http = ["requests>=2", "pandas>=2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "build>=1.2", "pandas-stubs>=2.2.2.240603"]

[project.scripts]
finbrain-mcp = "finbrain_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools_scm]

[tool.ruff.lint]
# Pin the rule set explicitly. `ruff check .` otherwise follows whatever ruff's
# current defaults happen to be, so a new ruff release can turn CI red with no
# code change (0.16.0 widened the defaults and surfaced hundreds of findings in
# code that had been passing). These four are ruff's long-standing defaults, so
# this preserves existing behaviour rather than changing it.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true

# numpy ships inline stubs using PEP 695 `type` statements, which mypy cannot
# parse unless it is running under Python 3.12+. On the 3.10 and 3.11 matrix
# jobs a numpy release can therefore abort the whole run with no change to this
# codebase. Nothing here surfaces numpy types, so skip its stubs.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
